command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: LAKEBASE_ENDPOINT
    value: "projects/lb-project-01/branches/production/endpoints/primary"
  - name: PGHOST
    value: "ep-sweet-feather-d87u6wuh.database.us-east-2.cloud.databricks.com"
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "databricks_postgres"
  - name: PGSSLMODE
    value: "require"
  # Databricks Genie space governing the trusted Gold-layer (Unity Catalog) data
  # the analytics agent may query.
  - name: GENIE_SPACE_ID
    value: "01f1962f60ee1de78df62117597bc1e3"
  # Optional: pin the agent's reasoning LLM to a specific serving endpoint. Leave
  # empty to auto-discover a chat-capable Foundation Model endpoint in the workspace.
  - name: DATABRICKS_LLM_ENDPOINT
    value: ""
  # PGUSER is injected by the attached Lakebase resource as the app's service
  # principal. Set it here only if that resource is not configured.
